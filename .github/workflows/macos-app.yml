name: macOS app (unsigned)

# An Apple Silicon build of the desktop app, uploaded as a workflow
# artifact. It is not a release and nothing is published. The bundle gets
# an ad-hoc seal (codesign --sign -) so Gatekeeper can see an intact app.
# That is not a Developer ID signature and it is not notarised. GitHub's
# macOS 15 runner is arm64; this file does not claim a Linux runner can
# produce a signed macOS installer.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Confirm this runner is Apple Silicon
        run: |
          set -euo pipefail
          echo "uname: $(uname -m) $(sw_vers -productVersion)"
          test "$(uname -m)" = "arm64"

      - name: Build the .app
        run: make app

      - name: Pack the zip and dmg, then verify the extracted copies
        run: sh build/darwin/pack-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: magpie-darwin-arm64-unsigned
          path: |
            dist/magpie-darwin-arm64-unsigned.zip
            dist/magpie-darwin-arm64-unsigned.dmg
            dist/UNSIGNED.txt
            dist/SIGNATURE.txt
          if-no-files-found: error
          retention-days: 14
